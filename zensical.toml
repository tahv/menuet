[project]
site_name = "menuet"
site_description = "Declarative menu builder for DCC applications"
site_author = "Thibaud Gambier"
site_url = "https://tahv.gitlab.io/menuet"
copyright = "&copy 2026, Thibaud Gambier"
nav = [
  { "Home" = "index.md" },
  { "Configuration" = "configuration.md" },
  { "Examples" = "examples.md" },
  { "Recipes" = "recipes.md" },
  { "API Reference" = "api.md" },
  { "Changelog" = "changelog.md" },
  { "PyPI" = "https://pypi.org/project/menuet" },
  { "Contributing" = "https://gitlab.com/tahv/menuet/-/blob/main/CONTRIBUTING.md" },
]
repo_url = "https://gitlab.com/tahv/menuet"
repo_name = "tahv/menuet"
extra_css = [
  "stylesheets/extra.css",
  "stylesheets/versionmodified.css",
]
use_directory_urls = true

# tombi: lint.rules.table-key-required.disabled = true
[project.theme]
favicon = "assets/favicon.svg"
language = "en"
features = [
  "content.tabs.link",  # sync content tabs that have the same titles
  "navigation.indexes",  # `index.md` at the beginning of a navigation section are attached to the section
  "navigation.path",  # render a breadcrumb navigation above the title of each page
  "navigation.sections",  # render top-level sections as groups in the sidebar
  "navigation.top",  # back-to-top button
  "search.highlight",  # highlight search result occurrences
]
icon.logo = "lucide/music-4"
icon.repo = "fontawesome/brands/git-alt"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/git-alt"
link = "https://gitlab.com/tahv/menuet"

# tombi: lint.rules.type-mismatch.disabled = true
[project.markdown_extensions]
attr_list = {}
toc.permalink = true
pymdownx.blocks.admonition.types = [
  "example",
  "info",
  "note",
  "tip",
  "warning",
  "disclosure",
]
pymdownx.blocks.details = {}
pymdownx.blocks.tab.alternate_style = true
pymdownx.blocks.tab.slugify.object = "pymdownx.slugs.slugify"
pymdownx.blocks.tab.slugify.kwds.case = "lower"
pymdownx.blocks.html = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets = {}
pymdownx.superfences = {}
versionmodified.release_url = "./changelog/#{version}"
versionmodified.version_expression = "version.replace('.', '')"

# tombi: lint.rules.type-mismatch.disabled = true
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://docs.blender.org/api/5.1/objects.inv",
  "https://doc.qt.io/qtforpython-6/objects.inv",
  "https://dev.epicgames.com/documentation/en-us/unreal-engine/python-api/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "list"
inherited_members = true
show_source = false
show_symbol_type_toc = true
show_symbol_type_heading = true
show_signature_annotations = true
separate_signature = true
show_if_no_docstring = true
line_length = 60
merge_init_into_class = true
show_root_members_full_path = false
show_labels = false
signature_crossrefs = true
show_bases = false
show_root_heading = true
annotations_path = "source"
extensions = [{ griffe_fieldz.remove_fields_from_members = true }]

[project.plugins.table-reader]
